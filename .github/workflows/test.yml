name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v5.0.0
        with:
          node-version: '20'

      - name: Test endorlabs-scan
        run: node --test skills/endorlabs-scan/lib.test.mjs

      - name: Test sonarcloud-scan
        run: node --test skills/sonarcloud-scan/scan.test.mjs

      - name: Test defender-scan
        run: node --test skills/defender-scan/scan.test.mjs
