name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  semgrep:
    name: Skill security scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install semgrep
        run: pip install semgrep

      - name: Run skill security rules
        run: |
          semgrep \
            --config .semgrep/skill-security.yml \
            skills/ \
            --error \
            --sarif \
            --output semgrep.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif

  skillspector:
    name: Skillspector scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install skillspector
        run: uv tool install git+https://github.com/NVIDIA/skillspector.git

      - name: Run skillspector (static, baseline-suppressed)
        run: |
          skillspector scan skills/ \
            --no-llm \
            --baseline skills/.skillspector-baseline.yaml \
            --format sarif \
            --output skillspector.sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: skillspector.sarif
